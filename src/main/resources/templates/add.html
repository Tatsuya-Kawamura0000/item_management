<!DOCTYPE html>
<html lang="ja"
      xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">

	<title>食材を追加</title>

	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/bottom-navigation.css}">
	<link rel="stylesheet" th:href="@{/css/add.css}">
</head>

<body>

<main class="add-page">

	<!-- ヘッダー -->
	<header class="add-header">

		<div class="page-title-area">
			<h1 class="page-title">
				食材を追加
			</h1>

			<p class="page-description">
				食材の追加方法を選択してください
			</p>
		</div>

		<!-- ユーザー情報 -->
		<div class="user-info-area">

			<div class="user-area">

				<p class="user-name"
				   th:text="|${#authentication.name} さん|">
					〇〇さん
				</p>

				<p class="user-message">
					食材を登録して期限を管理しましょう
				</p>

			</div>

			<form th:action="@{/logout}" method="post">

				<button type="submit"
				        class="logout-button">

					<span class="logout-icon">↪</span>

					<span>ログアウト</span>

				</button>

			</form>

		</div>

	</header>


	<!-- 追加方法 -->
	<section class="add-method-section">

		<div class="section-header">

			<h2 class="section-title">
				追加方法を選択
			</h2>

		</div>


		<div class="add-method-grid">

			<!-- 手動追加 -->
			<a href="#"
			   class="add-method-card manual-card">

				<div class="method-icon-wrapper">

					<svg class="method-icon"
					     viewBox="0 0 24 24"
					     fill="none"
					     stroke="currentColor"
					     stroke-width="1.8"
					     stroke-linecap="round"
					     stroke-linejoin="round">

						<rect x="3" y="5" width="18" height="14" rx="2"></rect>

						<path d="M7 9h.01"></path>
						<path d="M10 9h.01"></path>
						<path d="M13 9h.01"></path>
						<path d="M16 9h.01"></path>

						<path d="M7 12h.01"></path>
						<path d="M10 12h.01"></path>
						<path d="M13 12h.01"></path>
						<path d="M16 12h.01"></path>

						<path d="M7 15h10"></path>

					</svg>

				</div>

				<div class="method-content">

                    <span class="method-label">
                        MANUAL
                    </span>

					<h3 class="method-title">
						手動で追加
					</h3>

					<p class="method-description">
						食材名や賞味期限を
						自分で入力します
					</p>

				</div>

				<span class="method-arrow">
                    →
                </span>

			</a>


			<!-- レシート読み取り -->
			<button type="button"
			        id="receiptMethodButton"
			        class="add-method-card receipt-card">

				<div class="method-icon-wrapper">

					<svg class="method-icon"
					     viewBox="0 0 24 24"
					     fill="none"
					     stroke="currentColor"
					     stroke-width="1.8"
					     stroke-linecap="round"
					     stroke-linejoin="round">

						<path d="M4 7h3l1.5-2h5L15 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>

						<circle cx="12" cy="13" r="3.5"></circle>

					</svg>

				</div>

				<div class="method-content">

                    <span class="method-label">
                        RECEIPT
                    </span>

					<h3 class="method-title">
						レシートを読み取る
					</h3>

					<p class="method-description">
						レシートをカメラで撮影して
						食材をまとめて登録します
					</p>

				</div>

				<span class="method-arrow">
                    →
                </span>

			</button>

		</div>

	</section>


	<!-- レシート読み取り案内 -->
	<section class="receipt-guide">

		<div class="guide-icon">
			↓
		</div>

		<div class="guide-content">

			<h2>
				レシート読み取りなら簡単
			</h2>

			<p>
				購入した食材をまとめて登録できるので、
				一つずつ入力する手間を減らせます。
			</p>

		</div>

	</section>

</main>

<!-- ========================================
     レシート読み取りモーダル
======================================== -->

<div id="receiptModal"
     class="modal-overlay">

	<div class="modal-container">

		<button type="button"
		        id="closeReceiptModal"
		        class="modal-close"
		        aria-label="閉じる">
			×
		</button>


		<div class="modal-camera-icon">

			<svg viewBox="0 0 24 24"
			     fill="none"
			     stroke="currentColor"
			     stroke-width="1.7"
			     stroke-linecap="round"
			     stroke-linejoin="round">

				<path d="M4 7h3l1.5-2h5L15 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>

				<circle cx="12" cy="13" r="3.5"></circle>

			</svg>

		</div>


		<h2 class="modal-title">
			レシートを読み取る
		</h2>

		<p class="modal-message">
			レシートをカメラで撮影すると、<br>
			購入した食材をまとめて登録できます。
		</p>


		<button type="button"
		        class="camera-start-button">

			<svg class="camera-button-icon"
			     viewBox="0 0 24 24"
			     fill="none"
			     stroke="currentColor"
			     stroke-width="1.8"
			     stroke-linecap="round"
			     stroke-linejoin="round">

				<path d="M4 7h3l1.5-2h5L15 7h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"></path>

				<circle cx="12" cy="13" r="3.5"></circle>

			</svg>

			カメラを起動

		</button>


		<button type="button"
		        id="manualFromModal"
		        class="modal-secondary-button">

			手動で追加する

		</button>

	</div>

</div>

<!-- 下部ナビゲーション -->
<div th:replace="~{fragments/bottom-navigation :: bottomNavigation}"></div>

<!-- 共通JS -->
<script th:src="@{/js/common.js}"></script>

<!-- 食材追加画面専用JS -->
<script th:src="@{/js/add.js}"></script>

</body>
</html>
