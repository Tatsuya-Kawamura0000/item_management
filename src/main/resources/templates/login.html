<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#ff8c42" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <script defer src="/js/pwa.js"></script>
    <title>ログイン - 管理機能</title>

    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/login.css}" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body class="auth-page login-page">
<div class="auth-card login-container">
    <header class="auth-header">
        <div class="auth-badge"><i class="fa-solid fa-user-lock"></i></div>
        <h1 class="auth-title">ログイン</h1>
        <p class="auth-subtitle">続けるにはアカウントにサインインしてください</p>
    </header>

    <form class="auth-form" th:action="@{/login}" method="post">
        <div class="auth-form-row">
            <label for="username">ユーザー名</label>
            <input id="username" type="text" name="username" placeholder="ユーザー名" required autofocus aria-required="true" />
        </div>

        <div class="auth-form-row">
            <label for="password">パスワード</label>
            <input id="password" type="password" name="password" placeholder="パスワード" required aria-required="true" />
        </div>

        <button type="submit" class="auth-button">ログイン</button>
    </form>

    <div th:if="${param.error}" class="auth-error field-error">
        ユーザー名またはパスワードが間違っています
    </div>

    <div class="auth-footer form-footer">
        <a th:href="@{/register}" class="add-btn">新規ユーザー登録</a>
    </div>
</div>
</body>
</html>
