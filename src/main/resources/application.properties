spring.application.name=itemmanagement
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}


spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8
spring.sql.init.platform=postgres
logging.level.com.example.itemmanagement.repository=DEBUG
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

app.url=https://item-management-jkf3.onrender.com/

GEMINI_API_KEY=${GEMINI_API_KEY}

OPENAI_API_KEY=${OPENAI_API_KEY}

# Web Push VAPID（値は環境変数。秘密鍵をここに書かない）
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:}