spring.application.name=itemmanagement
spring.datasource.driver-class-name=org.postgresql.Driver


spring.datasource.url=jdbc:postgresql://localhost:5432/itemmanagement
spring.datasource.username=springuser
spring.datasource.password=root

spring.sql.init.mode=never
logging.level.com.example.itemmanagement.repository=DEBUG
mybatis.mapper-locations=classpath:/mapper/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

app.url=https://item-management-jkf3.onrender.com/

SENDGRID_API_KEY=${SENDGRID_API_KEY}

GEMINI_API_KEY=${GEMINI_API_KEY}

OPENAI_API_KEY=${OPENAI_API_KEY}

# Web Push VAPID（ローカルは .env または環境変数から読む）
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:}

# GitHub ActionsからのPush通知処理実行用シークレット
push.notification.secret=${PUSH_NOTIFICATION_SECRET:}